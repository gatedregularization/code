services:
  dev:
    build:
      context: .
      target: dev
      args:
        USER_ID: ${UID:-1000}
        GROUP_ID: ${GID:-1000}
    image: gr-dev:latest
    container_name: gr-dev
    hostname: gr-dev
    security_opt:           #
      - seccomp=unconfined  #
    ipc: host               # These settings are okay to use in a local devcontainer
    volumes:
      - .:/app
    working_dir: /app
    gpus: all

  run:
    build:
      context: .
      target: run
      args:
        USER_ID: ${UID:-1000}
        GROUP_ID: ${GID:-1000}
    image: gr-run:latest
    container_name: gr-run
    hostname: gr-run
    volumes:
      - .:/app
    working_dir: /app
    gpus: all
